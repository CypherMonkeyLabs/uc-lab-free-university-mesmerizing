<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 308" data-animated="false" role="img"><rect width="860" height="308" fill="#0b0618"/>
<rect class="" x="40" y="24" width="780" height="60" rx="12" fill="#141028" stroke="#e879f9"/><text x="60" y="50" font-size="16" font-family="Georgia, serif" fill="#f5f7ff">Voice RTP</text><text x="60" y="70" font-size="13" font-family="Segoe UI, sans-serif" fill="#c4b5fd">Commonly EF, DSCP 46, then a priority queue</text>
