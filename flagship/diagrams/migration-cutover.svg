<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 256" data-animated="true" role="img">
<rect width="100%" height="100%" fill="#0b0618"/>
<style>.hop{stroke-dasharray:7 5;animation:dash 1.1s linear infinite}.pkt{animation:ride 2.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes ride{to{offset-distance:100%}}</style>
<text x="75" y="24" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#f5f7ff">Old PBX</text><line x1="75" y1="34" x2="75" y2="246" stroke="#3b3260"/>
<text x="225" y="24" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#f5f7ff">SBC</text><line x1="225" y1="34" x2="225" y2="246" stroke="#3b3260"/>
<text x="375" y="24" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#f5f7ff">New cloud</text><line x1="375" y1="34" x2="375" y2="246" stroke="#3b3260"/>
<line class="hop" x1="75" y1="58" x2="225" y2="58" stroke="#5eead4" stroke-width="2"/><text x="150.0" y="50" text-anchor="middle" font-size="12" font-family="Segoe UI, sans-serif" fill="#f9a8d4">canary DID</text>
<circle class="pkt" r="5" fill="#e07a5f" style="offset-path: path('M 75 58 H 225'); offset-rotate: 0deg;"/>
<line class="hop" x1="225" y1="104" x2="375" y2="104" stroke="#5eead4" stroke-width="2"/><text x="300.0" y="96" text-anchor="middle" font-size="12" font-family="Segoe UI, sans-serif" fill="#f9a8d4">INVITE</text>
<circle class="pkt" r="5" fill="#e07a5f" style="offset-path: path('M 225 104 H 375'); offset-rotate: 0deg;"/>
<line class="hop" x1="375" y1="150" x2="225" y2="150" stroke="#5eead4" stroke-width="2"/><text x="300.0" y="142" text-anchor="middle" font-size="12" font-family="Segoe UI, sans-serif" fill="#f9a8d4">200</text>
<circle class="pkt" r="5" fill="#e07a5f" style="offset-path: path('M 375 150 H 225'); offset-rotate: 0deg;"/>
<line class="hop" x1="225" y1="196" x2="75" y2="196" stroke="#5eead4" stroke-width="2"/><text x="150.0" y="188" text-anchor="middle" font-size="12" font-family="Segoe UI, sans-serif" fill="#f9a8d4">rollback path</text>
<circle class="pkt" r="5" fill="#e07a5f" style="offset-path: path('M 225 196 H 75'); offset-rotate: 0deg;"/>
</svg>