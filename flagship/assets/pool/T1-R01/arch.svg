<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="t1title t1desc">
  <title id="t1title">Unified CM cluster and dial-plan path</title>
  <desc id="t1desc">A phone sends digits to a subscriber. Digit analysis concatenates line and device calling search spaces, matches a partition, and may translate before a route pattern selects a route list, route group, and trunk or gateway.</desc>
  <rect width="980" height="460" fill="#0a1020"/>
  <text x="24" y="32" fill="#3dbeff" font-family="ui-monospace,monospace" font-size="13">T1-R01 · cluster and dial plan</text>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#e7ecf5">
    <rect x="24" y="52" width="200" height="64" rx="8" fill="#121826" stroke="#3dbeff"/>
    <text x="36" y="76">Publisher</text>
    <text x="36" y="96" fill="#93a0b8" font-size="12">Config database, first node</text>
    <rect x="244" y="52" width="220" height="64" rx="8" fill="#121826" stroke="#3dbeff"/>
    <text x="256" y="76">Call-processing subscribers</text>
    <text x="256" y="96" fill="#93a0b8" font-size="12">Cisco CallManager service</text>
    <rect x="484" y="52" width="180" height="64" rx="8" fill="#121826" stroke="#3dbeff"/>
    <text x="496" y="76">TFTP</text>
    <text x="496" y="96" fill="#93a0b8" font-size="12">Config files, ITL</text>
    <rect x="684" y="52" width="270" height="64" rx="8" fill="#121826" stroke="#f0b429"/>
    <text x="696" y="76">IM&amp;P / Unity / Expressway</text>
    <text x="696" y="96" fill="#93a0b8" font-size="12">Integrated, not the dial-plan core</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#e7ecf5">
    <rect x="24" y="170" width="140" height="70" rx="8" fill="#171e2c" stroke="#e7ecf5"/>
    <text x="40" y="200">1 · Phone</text>
    <text x="40" y="220" fill="#93a0b8" font-size="12">Digits or URI</text>
    <rect x="200" y="170" width="170" height="70" rx="8" fill="#171e2c" stroke="#3dbeff"/>
    <text x="214" y="200">2 · Digit analysis</text>
    <text x="214" y="220" fill="#93a0b8" font-size="12">On the subscriber</text>
    <rect x="406" y="150" width="200" height="110" rx="8" fill="#171e2c" stroke="#f0b429"/>
    <text x="420" y="178">3 · CSS</text>
    <text x="420" y="198" fill="#93a0b8" font-size="12">Line CSS, then device CSS</text>
    <text x="420" y="218" fill="#93a0b8" font-size="12">ordered partition list</text>
    <text x="420" y="238" fill="#93a0b8" font-size="12">[cite:6] order</text>
    <rect x="642" y="170" width="160" height="70" rx="8" fill="#171e2c" stroke="#3dd68c"/>
    <text x="656" y="200">4 · Best pattern</text>
    <text x="656" y="220" fill="#93a0b8" font-size="12">DN, xlate, route</text>
    <rect x="200" y="320" width="170" height="78" rx="8" fill="#171e2c" stroke="#b388ff"/>
    <text x="214" y="350">5 · Translate?</text>
    <text x="214" y="370" fill="#93a0b8" font-size="12">Then analyze again</text>
    <rect x="406" y="320" width="200" height="78" rx="8" fill="#171e2c" stroke="#ff8a4c"/>
    <text x="420" y="350">6 · Route list</text>
    <text x="420" y="370" fill="#93a0b8" font-size="12">Route group or local RG</text>
    <rect x="642" y="320" width="300" height="78" rx="8" fill="#171e2c" stroke="#ff6b8a"/>
    <text x="656" y="350">7 · Trunk, gateway, or phone</text>
    <text x="656" y="370" fill="#93a0b8" font-size="12">CUBE, PSTN, Unity, hunt pilot</text>
  </g>
  <g stroke="#3d4d66" fill="none" stroke-width="1.5">
    <path d="M164 205 H200"/>
    <path d="M370 205 H406"/>
    <path d="M606 205 H642"/>
    <path d="M285 240 V320"/>
    <path d="M370 359 H406"/>
    <path d="M606 359 H642"/>
  </g>
</svg>
