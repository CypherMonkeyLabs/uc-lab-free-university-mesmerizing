<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="t7t t7d">
  <title id="t7t">Mobile and Remote Access with certificate trust</title>
  <desc id="t7d">A remote client discovers Expressway-E with a collab-edge SRV record, traverses to Expressway-C, and reaches Unified CM, IM and Presence, and Unity Connection. Certificates must chain both ways.</desc>
  <rect width="980" height="460" fill="#0a1020"/>
  <text x="24" y="28" fill="#ff6b8a" font-family="ui-monospace,monospace" font-size="13">T7-R01 · edge and trust</text>
  <rect x="620" y="48" width="340" height="400" fill="#141018" stroke="#ff6b8a" rx="10"/>
  <text x="636" y="72" fill="#ff6b8a" font-family="Segoe UI,sans-serif" font-size="13">DMZ / untrusted side</text>
  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#e7ecf5">
    <rect x="24" y="90" width="200" height="78" rx="8" fill="#171e2c" stroke="#7eb6ff"/>
    <text x="38" y="122">1 · Remote client</text>
    <text x="38" y="144" fill="#93a0b8" font-size="12">Jabber or Webex App</text>
    <rect x="660" y="100" width="270" height="90" rx="8" fill="#171e2c" stroke="#ff6b8a"/>
    <text x="676" y="132">2 · Expressway-E</text>
    <text x="676" y="154" fill="#93a0b8" font-size="12">_collab-edge._tls : 8443</text>
    <text x="676" y="174" fill="#93a0b8" font-size="12">Public CA certificate</text>
    <rect x="280" y="200" width="250" height="90" rx="8" fill="#171e2c" stroke="#f0b429"/>
    <text x="296" y="232">3 · Expressway-C</text>
    <text x="296" y="254" fill="#93a0b8" font-size="12">Traversal client, inside</text>
    <text x="296" y="274" fill="#93a0b8" font-size="12">Trusts UC servers</text>
    <rect x="24" y="330" width="170" height="70" rx="8" fill="#171e2c" stroke="#3dbeff"/>
    <text x="38" y="360">4 · Unified CM</text>
    <text x="38" y="380" fill="#93a0b8" font-size="12">UDS + SIP reg</text>
    <rect x="214" y="330" width="170" height="70" rx="8" fill="#171e2c" stroke="#b388ff"/>
    <text x="228" y="360">5 · IM&amp;P</text>
    <text x="228" y="380" fill="#93a0b8" font-size="12">Presence, chat</text>
    <rect x="404" y="330" width="180" height="70" rx="8" fill="#171e2c" stroke="#3dd68c"/>
    <text x="418" y="360">6 · Unity</text>
    <text x="418" y="380" fill="#93a0b8" font-size="12">Voicemail</text>
  </g>
  <g fill="none" stroke="#3d4d66">
    <path d="M224 129 H660" stroke="#7eb6ff"/>
    <path d="M660 190 H530 V200" stroke="#ff6b8a"/>
    <path d="M320 290 V330" stroke="#3dbeff"/>
    <path d="M400 290 V330" stroke="#b388ff"/>
    <path d="M490 290 V330" stroke="#3dd68c"/>
  </g>
</svg>
