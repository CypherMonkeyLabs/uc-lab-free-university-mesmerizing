<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="760" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="ecoTitle ecoDesc">
  <title id="ecoTitle">Cypher UC Lab ecosystem</title>
  <desc id="ecoDesc">Unified CM at the center. IM and Presence, Unity Connection, CUBE, Expressway, SRST, and Emergency Responder attach directly. Sister systems and cloud platforms sit on the outside.</desc>
  <rect width="1100" height="760" fill="#0a1020"/>
  <text x="36" y="36" fill="#e7ecf5" font-family="Georgia, serif" font-size="22">Collaboration ecosystem</text>
  <text x="36" y="58" fill="#93a0b8" font-family="Segoe UI, sans-serif" font-size="13">On-premises call control in the middle. Cloud calling and contact center on the rim.</text>
  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#e7ecf5">
    <circle cx="550" cy="360" r="78" fill="#121826" stroke="#3dbeff" stroke-width="2"/>
    <text x="550" y="354" text-anchor="middle">Unified CM</text>
    <text x="550" y="374" text-anchor="middle" fill="#93a0b8" font-size="12">T1 · T2</text>
    <rect x="250" y="150" width="160" height="54" rx="8" fill="#171e2c" stroke="#b388ff"/>
    <text x="330" y="182" text-anchor="middle">IM &amp; Presence · T3</text>
    <rect x="690" y="150" width="180" height="54" rx="8" fill="#171e2c" stroke="#3dd68c"/>
    <text x="780" y="182" text-anchor="middle">Unity Connection · T4</text>
    <rect x="70" y="330" width="170" height="54" rx="8" fill="#171e2c" stroke="#ff8a4c"/>
    <text x="155" y="362" text-anchor="middle">CUBE · T5</text>
    <rect x="860" y="330" width="190" height="54" rx="8" fill="#171e2c" stroke="#ff6b8a"/>
    <text x="955" y="362" text-anchor="middle">Expressway · T7</text>
    <rect x="250" y="520" width="160" height="54" rx="8" fill="#171e2c" stroke="#7eb6ff"/>
