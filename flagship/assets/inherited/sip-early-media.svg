<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 706" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Early media</title>
