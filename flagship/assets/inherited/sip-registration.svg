<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 490" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>SIP registration</title>
<desc>RFC 3261 digest challenge, then a binding</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7f3ee"/><stop offset="100%" stop-color="#e5f3f0"/></linearGradient>
<marker id="m-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e5f59"/></marker>
<marker id="m-rsp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2c3b86"/></marker>
<marker id="m-prov" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a12"/></marker>
<marker id="m-media" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9c3d38"/></marker>
</defs>
<rect width="748" height="490" fill="url(#bg)"/>
<text x="24" y="36" font-size="22" font-family="Georgia, Palatino, serif" fill="#1a2332">SIP registration</text>
<text x="24" y="58" font-size="14" fill="#3a495c">RFC 3261 digest challenge, then a binding</text>
<text x="218.0" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Phone (UAC)</text>
<line x1="218.0" y1="116" x2="218.0" y2="444" stroke="#b7cdc6" stroke-width="2" stroke-dasharray="4 6"/>
<text x="558.0" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Registrar</text>
<line x1="558.0" y1="116" x2="558.0" y2="444" stroke="#b7cdc6" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="26" cy="176" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">1</text>
<line x1="230.0" y1="176" x2="546.0" y2="176" stroke="#0e5f59" stroke-width="2.4" marker-end="url(#m-req)"/>
<text x="388.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#0e5f59" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">REGISTER</text>
<text x="388.0" y="196" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Request-URI is the domain</text>
<circle cx="26" cy="248" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">2</text>
<line x1="546.0" y1="248" x2="230.0" y2="248" stroke="#2c3b86" stroke-width="2.4" marker-end="url(#m-rsp)"/>
<text x="388.0" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3b86" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">401 Unauthorized</text>
<text x="388.0" y="268" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">WWW-Authenticate: Digest</text>
<circle cx="26" cy="320" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">3</text>
<line x1="230.0" y1="320" x2="546.0" y2="320" stroke="#0e5f59" stroke-width="2.4" marker-end="url(#m-req)"/>
<text x="388.0" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#0e5f59" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">REGISTER</text>
<text x="388.0" y="340" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Authorization: Digest response</text>
<circle cx="26" cy="392" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="396" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">4</text>
<line x1="546.0" y1="392" x2="230.0" y2="392" stroke="#2c3b86" stroke-width="2.4" marker-end="url(#m-rsp)"/>
<text x="388.0" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3b86" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">200 OK</text>
<text x="388.0" y="412" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Binding stored, Expires set</text>
<rect x="24" y="457" width="14" height="8" rx="2" fill="#0e5f59"/>
<text x="44" y="465" font-size="12" fill="#3a495c">Request</text>
<rect x="134" y="457" width="14" height="8" rx="2" fill="#2c3b86"/>
<text x="154" y="465" font-size="12" fill="#3a495c">Response</text>
<rect x="244" y="457" width="14" height="8" rx="2" fill="#8a5a12"/>
<text x="264" y="465" font-size="12" fill="#3a495c">Provisional</text>
<rect x="354" y="457" width="14" height="8" rx="2" fill="#9c3d38"/>
<text x="374" y="465" font-size="12" fill="#3a495c">Media</text>
</svg>