<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 1282" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Basic SIP call</title>
<desc>INVITE, 100, 180, 200, ACK, BYE</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7f3ee"/><stop offset="100%" stop-color="#e5f3f0"/></linearGradient>
<marker id="m-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e5f59"/></marker>
<marker id="m-rsp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2c3b86"/></marker>
<marker id="m-prov" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a12"/></marker>
<marker id="m-media" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9c3d38"/></marker>
</defs>
<rect width="968" height="1282" fill="url(#bg)"/>
<text x="24" y="36" font-size="22" font-family="Georgia, Palatino, serif" fill="#1a2332">Basic SIP call</text>
<text x="24" y="58" font-size="14" fill="#3a495c">INVITE, 100, 180, 200, ACK, BYE</text>
<text x="198.0" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Alice</text>
<line x1="198.0" y1="116" x2="198.0" y2="1236" stroke="#b7cdc6" stroke-width="2" stroke-dasharray="4 6"/>
<text x="498.0" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Proxy</text>
<line x1="498.0" y1="116" x2="498.0" y2="1236" stroke="#b7cdc6" stroke-width="2" stroke-dasharray="4 6"/>
<text x="798.0" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Bob</text>
<line x1="798.0" y1="116" x2="798.0" y2="1236" stroke="#b7cdc6" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="26" cy="176" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">1</text>
<line x1="210.0" y1="176" x2="486.0" y2="176" stroke="#0e5f59" stroke-width="2.4" marker-end="url(#m-req)"/>
<text x="348.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#0e5f59" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">INVITE</text>
<text x="348.0" y="196" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Early offer: SDP in INVITE</text>
<circle cx="26" cy="248" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">2</text>
<line x1="510.0" y1="248" x2="786.0" y2="248" stroke="#0e5f59" stroke-width="2.4" marker-end="url(#m-req)"/>
<text x="648.0" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#0e5f59" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">INVITE</text>
<text x="648.0" y="268" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Proxied toward Bob</text>
<circle cx="26" cy="320" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">3</text>
<line x1="786.0" y1="320" x2="510.0" y2="320" stroke="#8a5a12" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#m-prov)"/>
<text x="648.0" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a12" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">100 Trying</text>
<text x="648.0" y="340" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Hop-by-hop, not end-to-end</text>
<circle cx="26" cy="392" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="396" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">4</text>
<line x1="486.0" y1="392" x2="210.0" y2="392" stroke="#8a5a12" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#m-prov)"/>
<text x="348.0" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a12" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">100 Trying</text>
<text x="348.0" y="412" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">The proxy generates its own</text>
<circle cx="26" cy="464" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">5</text>
<line x1="786.0" y1="464" x2="510.0" y2="464" stroke="#8a5a12" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#m-prov)"/>
<text x="648.0" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a12" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">180 Ringing</text>
<text x="648.0" y="484" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Early dialog if a To tag is set</text>
<circle cx="26" cy="536" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">6</text>
<line x1="486.0" y1="536" x2="210.0" y2="536" stroke="#8a5a12" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#m-prov)"/>
<text x="348.0" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a12" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">180 Ringing</text>
<text x="348.0" y="556" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Relayed toward Alice</text>
<circle cx="26" cy="608" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="612" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">7</text>
<line x1="786.0" y1="608" x2="510.0" y2="608" stroke="#2c3b86" stroke-width="2.4" marker-end="url(#m-rsp)"/>
<text x="648.0" y="596" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3b86" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">200 OK</text>
<text x="648.0" y="628" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">SDP answer; dialog confirmed</text>
<circle cx="26" cy="680" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="684" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">8</text>
<line x1="486.0" y1="680" x2="210.0" y2="680" stroke="#2c3b86" stroke-width="2.4" marker-end="url(#m-rsp)"/>
<text x="348.0" y="668" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3b86" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">200 OK</text>
<text x="348.0" y="700" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Follows the Via path back</text>
<circle cx="26" cy="752" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="756" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">9</text>
<line x1="210.0" y1="752" x2="486.0" y2="752" stroke="#0e5f59" stroke-width="2.4" marker-end="url(#m-req)"/>
<text x="348.0" y="740" text-anchor="middle" font-size="15" font-weight="700" fill="#0e5f59" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">ACK</text>
<text x="348.0" y="772" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Separate transaction for a 2xx</text>
<circle cx="26" cy="824" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="828" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">10</text>
<line x1="510.0" y1="824" x2="786.0" y2="824" stroke="#0e5f59" stroke-width="2.4" marker-end="url(#m-req)"/>
<text x="648.0" y="812" text-anchor="middle" font-size="15" font-weight="700" fill="#0e5f59" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">ACK</text>
<text x="648.0" y="844" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Stays on path if Record-Routed</text>
<circle cx="26" cy="896" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="900" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">11</text>
<line x1="210.0" y1="896" x2="786.0" y2="896" stroke="#9c3d38" stroke-width="3.4" marker-end="url(#m-media)"/>
<text x="498.0" y="884" text-anchor="middle" font-size="15" font-weight="700" fill="#9c3d38" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">RTP</text>
<text x="498.0" y="916" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Media may bypass the proxy</text>
<circle cx="26" cy="968" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="972" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">12</text>
<line x1="210.0" y1="968" x2="486.0" y2="968" stroke="#0e5f59" stroke-width="2.4" marker-end="url(#m-req)"/>
<text x="348.0" y="956" text-anchor="middle" font-size="15" font-weight="700" fill="#0e5f59" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">BYE</text>
<text x="348.0" y="988" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Alice hangs up</text>
<circle cx="26" cy="1040" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="1044" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">13</text>
<line x1="510.0" y1="1040" x2="786.0" y2="1040" stroke="#0e5f59" stroke-width="2.4" marker-end="url(#m-req)"/>
<text x="648.0" y="1028" text-anchor="middle" font-size="15" font-weight="700" fill="#0e5f59" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">BYE</text>
<text x="648.0" y="1060" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Same Call-ID and tags</text>
<circle cx="26" cy="1112" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="1116" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">14</text>
<line x1="786.0" y1="1112" x2="510.0" y2="1112" stroke="#2c3b86" stroke-width="2.4" marker-end="url(#m-rsp)"/>
<text x="648.0" y="1100" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3b86" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">200 OK</text>
<text x="648.0" y="1132" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">BYE accepted</text>
<circle cx="26" cy="1184" r="12" fill="#fffdfb" stroke="#0e5f59"/>
<text x="26" y="1188" text-anchor="middle" font-size="11" font-weight="700" fill="#0e5f59">15</text>
<line x1="486.0" y1="1184" x2="210.0" y2="1184" stroke="#2c3b86" stroke-width="2.4" marker-end="url(#m-rsp)"/>
<text x="348.0" y="1172" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3b86" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">200 OK</text>
<text x="348.0" y="1204" text-anchor="middle" font-size="12" fill="#3a495c" stroke="#f4f7f6" stroke-width="4" paint-order="stroke fill">Dialog is gone</text>
<rect x="24" y="1249" width="14" height="8" rx="2" fill="#0e5f59"/>
<text x="44" y="1257" font-size="12" fill="#3a495c">Request</text>
<rect x="134" y="1249" width="14" height="8" rx="2" fill="#2c3b86"/>
<text x="154" y="1257" font-size="12" fill="#3a495c">Response</text>
<rect x="244" y="1249" width="14" height="8" rx="2" fill="#8a5a12"/>
<text x="264" y="1257" font-size="12" fill="#3a495c">Provisional</text>
<rect x="354" y="1249" width="14" height="8" rx="2" fill="#9c3d38"/>
<text x="374" y="1257" font-size="12" fill="#3a495c">Media</text>
</svg>