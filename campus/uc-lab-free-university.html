<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="UC Lab Free University v21. Guided paths for Cisco Voice Core, Webex Calling, Teams Phone, and Contact Center Engineer. 580 sections, offline after the shell is cached.">
<meta property="og:image" content="assets/og-card.png">
<meta name="theme-color" content="#0B1120">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UC Lab Free University</title>
<link rel="icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/app.css">
<script>
try {
  var prefs = JSON.parse(localStorage.getItem("uc_lab_settings_v21") || "{}");
  var saved = prefs.theme || localStorage.getItem("uc_theme");
  if (saved === "night" || saved === "aurora" || saved === "cobalt" || saved === "forest" || saved === "sunset") saved = "dark";
  if (saved === "paper" || saved === "warm") saved = "light";
  if (saved === "dark" || saved === "contrast" || saved === "light" || saved === "signal") document.documentElement.setAttribute("data-theme", saved);
  if (prefs.font === "sm" || prefs.font === "md" || prefs.font === "lg" || prefs.font === "xl") document.documentElement.setAttribute("data-font", prefs.font);
  if (prefs.motion === "reduce" || prefs.motion === "allow") document.documentElement.setAttribute("data-motion", prefs.motion);
} catch (err) { /* private mode */ }
window.STATS = {"version":"v21","built":"2026-10-14","sections":580,"note":"Modular v21 campus. CUCM, CUBE, SIP, Webex Calling, Teams Phone, UCCE/PCCE, CCaaS, E911, QoS."};
window.UC_NO_AUTOPLAY = true;
window.UC = window.UC || {};
UC._packs = {};
UC._pending = {};
UC.manifest = function (data) {
  UC.data = data;
  document.dispatchEvent(new Event("uc-manifest"));
};
UC.pack = function (section, flows) {
  UC._packs[section.id] = { section: section, flows: flows };
  var wait = UC._pending[section.id];
  if (wait) {
    delete UC._pending[section.id];
    wait(UC._packs[section.id]);
  }
};
UC.walks = function (list) {
  UC._walkList = list;
  document.dispatchEvent(new Event("uc-walks"));
};
</script>
</head>
<body>
<a class="skip" href="#viewTitle">Skip to content</a>
<header class="top">
  <button type="button" class="icon-btn" id="menuBtn" aria-expanded="false" aria-controls="side">Menu</button>
  <a class="brand" href="#/"><strong>UC Lab</strong><span>Free University</span></a>
  <button type="button" class="search-btn" id="searchBtn">Search <span>sections</span></button>
  <span class="grow"></span>
  <button type="button" class="search-btn" id="settingsBtn">Settings</button>
  <details class="menu">
    <summary>Export</summary>
    <div class="menu-panel">
      <button type="button" id="exportCsv">Question CSV</button>
      <button type="button" id="exportMd">Markdown for this lesson</button>
      <button type="button" id="exportJourney">Markdown for this path</button>
      <button type="button" id="printLesson">Print this lesson</button>
      <button type="button" id="saveOffline">Save lessons offline</button>
    </div>
  </details>
</header>
<div class="backdrop" id="backdrop" hidden></div>
<div class="shell">
  <nav id="side" class="side" aria-label="Certification paths"></nav>
  <main id="main">
    <h1 id="viewTitle">UC Lab</h1>
    <div id="view"></div>
  </main>
</div>
<nav class="bottom-nav" aria-label="Primary">
  <a href="#/" data-tab="home">Home</a>
  <a href="#/journey/cisco-voice" data-tab="paths">Paths</a>
  <a href="#/lab" data-tab="lab">Labs</a>
  <a href="#/search" data-tab="search">Search</a>
  <a href="#/progress" data-tab="progress">Progress</a>
</nav>
<div id="toast" class="toast" hidden role="status"></div>
<div id="palette" class="palette" hidden>
  <div class="palette-card" role="dialog" aria-modal="true" aria-labelledby="paletteLabel">
    <h2 id="paletteLabel" class="skip">Search</h2>
    <input id="paletteInput" type="search" placeholder="Search sections" aria-label="Search sections">
    <div id="paletteHits"></div>
  </div>
</div>
<div id="settings" class="palette" hidden>
  <div class="palette-card settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsLabel">
    <h2 id="settingsLabel">Settings</h2>
    <form id="settingsForm">
      <fieldset>
        <legend>Theme</legend>
        <label><input type="radio" name="theme" value="light"> Light</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
        <label><input type="radio" name="theme" value="contrast"> High contrast</label>
        <label><input type="radio" name="theme" value="signal"> Signal</label>
      </fieldset>
      <fieldset>
        <legend>Sound and speech</legend>
        <label><input type="checkbox" id="setSound"> Sound effects</label>
        <label><input type="checkbox" id="setNarration"> Narrate new pages</label>
        <label>Voice <select id="setVoice" aria-label="Narration voice"></select></label>
        <p id="setVoiceNote" class="muted"></p>
        <label>Speed <input id="setRate" type="range" min="0.7" max="1.4" step="0.1" value="1" aria-valuemin="0.7" aria-valuemax="1.4"></label>
        <p class="muted">Speed <span id="setRateOut">1.0</span></p>
        <button type="button" id="setRead">Read this page aloud</button>
      </fieldset>
      <fieldset>
        <legend>Motion and type</legend>
        <label>Motion <select id="setMotion" aria-label="Motion">
          <option value="system">Match this device</option>
          <option value="reduce">Reduce motion</option>
          <option value="allow">Allow motion</option>
        </select></label>
        <label>Font size <select id="setFont" aria-label="Font size">
          <option value="sm">Small</option>
          <option value="md">Medium</option>
          <option value="lg">Large</option>
          <option value="xl">Extra large</option>
        </select></label>
      </fieldset>
      <div class="actions" style="padding:0 16px">
        <button type="button" class="primary" id="settingsClose">Close</button>
      </div>
    </form>
  </div>
</div>
<script src="assets/telephony.js"></script>
<script src="assets/tools.js"></script>
<script src="assets/settings.js"></script>
<script src="assets/tips.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
