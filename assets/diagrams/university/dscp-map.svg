<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" role="img" aria-label="Voice marks">
<rect width="980" height="320" rx="18" fill="#0b1020"/>
<text x="24" y="36" fill="#fde68a" font-family="system-ui,sans-serif" font-size="18">Voice marks</text>
<rect x="40.0" y="70" width="276.0" height="64" rx="14" fill="#22d3ee"/>
<text x="178.0" y="108" text-anchor="middle" font-size="14" font-family="system-ui,sans-serif" fill="#0b1020">EF 46</text>
<rect x="340.0" y="70" width="276.0" height="64" rx="14" fill="#a5b4fc"/>
<text x="478.0" y="108" text-anchor="middle" font-size="14" font-family="system-ui,sans-serif" fill="#0b1020">CS3 signal</text>
<path d="M324.0 102 H340.0" stroke="#fff" stroke-width="3"/>
<rect x="640.0" y="70" width="276.0" height="64" rx="14" fill="#fbbf24"/>
<text x="778.0" y="108" text-anchor="middle" font-size="14" font-family="system-ui,sans-serif" fill="#0b1020">CS5 RFC</text>
