<text x="32" y="168" fill="#e0e7ff" font-size="15" font-family="system-ui,sans-serif">RFC 4594 maps telephony to EF. Cisco designs often mark signaling CS3. RFC 4594 points signaling at CS5. Say which standard you are using.</text>
