    <path d="M206 256h40M396 256h40M586 256h40" stroke="#2DD4BF" stroke-width="2" fill="none"/>
    <path d="M131 282 v28 h580" fill="none" stroke="#F5B942" stroke-width="2" stroke-dasharray="6 5"/>
