    <text x="321" y="261" text-anchor="middle" fill="#F4F7FB">CUCM</text>
    <rect x="436" y="230" width="150" height="52" rx="10" fill="#121A2F" stroke="#2DD4BF" stroke-width="2"/>
    <text x="511" y="261" text-anchor="middle" fill="#F4F7FB">CUBE</text>
    <rect x="626" y="230" width="170" height="52" rx="10" fill="#121A2F" stroke="#F5B942" stroke-width="2"/>
