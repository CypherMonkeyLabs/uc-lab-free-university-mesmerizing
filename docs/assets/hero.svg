  <text x="56" y="132" fill="#F4F7FB" font-family="Georgia, Times New Roman, serif" font-size="48">Voice, UC, and contact center</text>
  <text x="56" y="184" fill="#B7C2D0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">A modular offline campus for the work you actually do.</text>
