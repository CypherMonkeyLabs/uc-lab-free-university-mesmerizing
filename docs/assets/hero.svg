<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="UC Lab Free University, version 21. Voice, UC, and contact center.">
  <rect width="1200" height="440" rx="24" fill="#0B1220"/>
  <rect x="0" y="0" width="8" height="440" fill="#0F9B8E"/>
